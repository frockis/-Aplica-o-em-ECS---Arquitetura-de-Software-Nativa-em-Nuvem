# Sobe a aplicação e um PostgreSQL na sua máquina, para testar antes da AWS.
# Uso: docker compose up --build
# Depois abra http://localhost:8080

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notasdb
      POSTGRES_USER: notas_app
      POSTGRES_PASSWORD: uma_senha_de_teste
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas_app -d notasdb"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: notasdb
      DB_USER: notas_app
      DB_PASSWORD: uma_senha_de_teste
      APP_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
